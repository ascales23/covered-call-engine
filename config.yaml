# Covered-call paper-trading config. Strategy defaults come from prior modeling.
# Secrets are NOT here, they load from environment (.env). See README.

# ── Underlying & sizing ──────────────────────────────────────────────────────
underlying: "SPY"           # liquid options (penny spreads); switched from SCHD 2026-06-18
starting_capital: 95000     # seed for BOTH the strategy and the buy-and-hold benchmark
contracts_per_cycle: 1      # 1 SPY contract ≈ $75k at ~$746; ~21% cash reserve at $95k
benchmark_mode: true        # also track buy-and-hold of same $ in the same underlying

# ── Option selection ─────────────────────────────────────────────────────────
target_dte: 30              # days-to-expiration to target when selling
dte_tolerance: 7            # acceptable expiry window: [target-tol, target+tol] = 23..37
otm_pct: 2.5                # strike target = spot * (1 + otm_pct/100)
assignment_cap: 0.30        # reject strike whose prob-ITM (delta proxy) exceeds this
min_premium_dollars: 5.0    # skip writing if mid premium (per contract) below this
max_bid_ask_spread_pct: 15  # skip/limit-only if option spread wider than this % of mid

# ── Roll / assignment behaviour ──────────────────────────────────────────────
roll_trigger_dte: 5         # act when this many days remain on the short call
roll_if_itm: true           # true => roll up-and-out; false => allow assignment
reinvest_income: true       # premium + dividends buy more shares when >= 1 affordable

# ── Pricing model (Black-Scholes fallback / prob-ITM) ────────────────────────
risk_free_rate: 0.04        # annualized, for BS price/delta/prob-ITM
dividend_yield: 0.013       # annualized continuous yield used by BS (SPY ~1.3%)

# ── Data feed preference (first that answers wins; rest are fallback) ─────────
data_feed_order: ["ibkr", "alpaca"]

# ── Safety ───────────────────────────────────────────────────────────────────
# Paper-only is a hard invariant. The live path is unreachable: this flag must
# stay false; the loader hard-fails if it is ever true.
i_understand_this_is_live: false
kill_switch_file: "KILL_SWITCH"   # if this file exists in the project dir, no new orders

# ── Persistence / reporting outputs ──────────────────────────────────────────
db_path: "covered_call.sqlite"
report_csv: "reports/cycles.csv"
